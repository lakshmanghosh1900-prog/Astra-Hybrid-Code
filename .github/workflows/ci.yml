name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: make test
      - run: make lint
      - run: make format
      - run: make typecheck
      - run: python -m pip install -r security-requirements.lock
      - run: semgrep --config semgrep.yml --error --include '*.py' src tests scripts demo
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
