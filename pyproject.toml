[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-coder"
version = "0.1.0"
description = "Evidence-first, local-first autonomous coding agent control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Astra Coder contributors" }]
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "opentelemetry-api==1.29.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.38",
  "structlog==25.1.0",
  "tree-sitter==0.24.0",
  "tree-sitter-python==0.23.6",
  "typer==0.15.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.7",
]

[project.scripts]
astra = "astra_coder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["astra_coder"]
warn_unreachable = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["astra_coder"]

[tool.coverage.report]
show_missing = true
fail_under = 80
