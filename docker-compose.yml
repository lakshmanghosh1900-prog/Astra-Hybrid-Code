services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "astra_coder.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ASTRA_DATABASE_URL: sqlite:////data/astra.db
      ASTRA_BIND_HOST: 0.0.0.0
      ASTRA_BIND_PORT: 8000
    volumes:
      - astra-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  astra-data:
